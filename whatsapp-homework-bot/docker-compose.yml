services:
  bot:
    build: .
    container_name: homework-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
    volumes:
      - bot-data:/app/data
    # Сайт, панель управления (/app), состояние (/health) — только с самого сервера:
    # с компьютера откройте через SSH-туннель  ssh -L 3000:127.0.0.1:3000 user@сервер  → http://localhost:3000
    # Если порт 3000 на сервере уже занят — задайте в .env другой, например BOT_HTTP_PORT=3010.
    ports:
      - "127.0.0.1:${BOT_HTTP_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
