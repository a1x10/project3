<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stella HUD</title>
<style>
:root{--g:#33ff66;--d:#0b3a1a;--bg:#000}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--g);font:20px/1.25 "Courier New",monospace;overflow:hidden}
#top{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--d);font-size:15px}
#st.off{color:#ff5555}
#main{position:absolute;top:34px;bottom:30px;left:0;right:0;padding:10px 14px;overflow:hidden}
#foot{position:absolute;bottom:0;left:0;right:0;padding:5px 10px;border-top:1px solid var(--d);font-size:13px;color:#1f9a40;display:flex;justify-content:space-between}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.it{border:1px solid var(--d);padding:10px 8px;text-align:center}
.it.sel{background:var(--g);color:#000;font-weight:bold}
.row{padding:5px 0;border-bottom:1px dashed var(--d)}.row.sel{background:var(--d)}
.big{font-size:26px}.dim{color:#1f9a40}
#toast{position:absolute;left:8px;right:8px;top:40px;background:#001a08;border:2px solid var(--g);padding:10px;display:none;z-index:5;max-height:55%;overflow:hidden}
#overlay{position:absolute;inset:0;background:#000;display:none;z-index:9;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:16px}
#overlay img{max-width:80%;max-height:60%;border:2px solid var(--g);filter:grayscale(1) sepia(1) hue-rotate(70deg) saturate(4)}
.scan{animation:bl 0.9s infinite}@keyframes bl{50%{opacity:.25}}
.bar{width:70%;height:8px;border:1px solid var(--g);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:30%;background:var(--g);animation:mv 1.1s infinite linear}
@keyframes mv{from{margin-left:-30%}to{margin-left:100%}}
#cam{position:absolute;width:1px;height:1px;opacity:0}
#sub{position:absolute;left:0;right:0;bottom:30px;padding:8px 12px;background:#000c;font-size:19px;display:none}
#hint{color:#000;background:var(--g);padding:4px 8px;margin-top:4px;display:none}
#busy{position:absolute;left:0;right:0;bottom:30px;padding:6px 14px;background:#000;border-top:1px solid var(--g);display:none;z-index:6}
#busy .l{display:flex;gap:8px;align-items:center}#spin{display:inline-block;width:1.2em}
#busy .bar{width:100%;margin:6px 0 0}
#wave{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:6px}#wave i{flex:1;background:var(--g);height:4px;transition:height .08s}
#boot{position:absolute;inset:0;background:#000;z-index:10;display:none;flex-direction:column;justify-content:center;padding:0 18px}
#boot .t{font-size:24px;margin-bottom:10px}#boot .p{height:12px;border:1px solid var(--g)}#boot .p i{display:block;height:100%;width:0;background:var(--g);transition:width .9s ease-out}
#boot .s{margin-top:10px;color:#1f9a40;min-height:3.4em}
.fade{animation:fd .25s ease-out}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dots::after{content:"";animation:dt 1.2s steps(4) infinite}@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:8}
#cfg{padding:20px}#cfg input{width:100%;background:#000;color:var(--g);border:1px solid var(--g);padding:8px;font:inherit;margin:6px 0}
</style></head><body>
<div id="top"><span>STELLA <span id="mic" class="dim"></span></span><span id="clock"></span><span id="st" class="off">● offline</span></div>
<div id="main"></div>
<div id="toast"></div>
<div id="busy"><div class="l"><span id="spin">⠋</span><span id="blabel"></span></div><div class="bar"><i></i></div><div id="wave" style="display:none"></div></div>
<div id="boot"><div class="t"></div><div class="p"><i></i></div><div class="s"></div></div>
<div id="overlay"></div>
<div id="sub"><div id="subt"></div><div id="hint"></div></div>
<div id="dbg" style="position:absolute;left:10px;right:10px;bottom:34px;font-size:12px;color:#1f9a40;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
<div id="foot"><span>◀ ▶ выбор · ⏎ ок · ▲ назад</span><span>V голос · C камера</span></div>
<video id="cam" playsinline muted></video>
<script>
"use strict";
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
// автонастройка для очков без клавиатуры: /hud#key=...&base=...
try{const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("key")){store.set("stella_key",h.get("key"));store.set("stella_base",h.get("base")||location.origin);history.replaceState(null,"",location.pathname)}}catch(e){}
let KEY=store.get("stella_key"),BASE=store.get("stella_base")||location.origin;
const H=()=>({Authorization:"Bearer "+KEY});
const MENU=[["Сообщения","messages"],["Календарь","calendar"],["Дом","home"],["Зрение","vision"],["Лица","faces"],["Память","memory"],["Совещание","meeting"],["3D-модель","lab"]];
let screen="menu",idx=0,list=[],lastHud="Готова.",busy=false;


/* ---------- анимации: занятость, запись, запуск режимов ---------- */
const FR="⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";let spinI=0,spinT=null,busyN=0;
function busyOn(label,wave){
  busyN++;$("blabel").textContent=label;$("blabel").className="dots";$("busy").style.display="block";$("wave").style.display=wave?"flex":"none";
  if(!spinT)spinT=setInterval(()=>{$("spin").textContent=FR[spinI=(spinI+1)%FR.length]},90);
}
function busyOff(force){
  busyN=force?0:Math.max(0,busyN-1);
  if(busyN===0){$("busy").style.display="none";clearInterval(spinT);spinT=null}
}
const waveEl=$("wave");for(let i=0;i<14;i++)waveEl.appendChild(document.createElement("i"));
function waveLevel(l){[...waveEl.children].forEach((b,i)=>{const v=Math.min(1,l*(0.6+0.4*Math.sin(Date.now()/90+i)));b.style.height=(4+v*30)+"px"})}
function bootAnim(title,lines,after){
  const b=$("boot");b.style.display="flex";b.querySelector(".t").textContent=title;
  const bar=b.querySelector(".p i"),st=b.querySelector(".s");bar.style.transition="none";bar.style.width="0";st.textContent="";
  requestAnimationFrame(()=>{bar.style.transition="width .9s ease-out";bar.style.width="100%"});
  lines.forEach((t,i)=>setTimeout(()=>{st.textContent=t},i*300));
  setTimeout(()=>{b.style.display="none";if(after)after()},1000+lines.length*0);
}

/* ---------- голос на выход ---------- */
let speaking=false,awakeUntil=0,speakT;
function doneSpeaking(){speaking=false;awakeUntil=Date.now()+9000}   // после ответа 9 с можно говорить без «Стелла»
let ttsAudio=null,ttsOn=false;
async function speak(t){
  t=String(t||"").trim();if(!t)return;
  speaking=true;clearTimeout(speakT);speakT=setTimeout(doneSpeaking,Math.min(30000,4000+t.length*110));   // страховка
  try{if(ttsAudio){ttsAudio.pause();ttsAudio=null}speechSynthesis.cancel()}catch(e){}
  if(ttsOn){
    try{
      const r=await fetch(BASE+"/tts",{method:"POST",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify({text:t})});
      if(!r.ok)throw new Error(r.status);
      const url=URL.createObjectURL(await r.blob());const au=new Audio(url);ttsAudio=au;
      au.onended=au.onerror=()=>{clearTimeout(speakT);URL.revokeObjectURL(url);setTimeout(doneSpeaking,300)};
      await au.play();return;
    }catch(e){/* нет ElevenLabs или ошибка — обычный голос устройства */}
  }
  try{const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";
    u.onend=u.onerror=()=>{clearTimeout(speakT);setTimeout(doneSpeaking,400)};speechSynthesis.speak(u)}catch(e){}
}
function beep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}

/* ---------- тосты ---------- */
let toastT;
function toast(t,ms=6000){const e=$("toast");e.textContent=t;e.style.display="block";lastHud=t;clearTimeout(toastT);toastT=setTimeout(()=>{e.style.display="none"},ms)}
function overlay(html,ms){const o=$("overlay");o.innerHTML=html;o.style.display="flex";if(ms)setTimeout(()=>{o.style.display="none";if(screen==="menu")render()},ms)}
const hideOverlay=()=>{$("overlay").style.display="none"};

/* ---------- экраны ---------- */
function render(){
  const m=$("main");
  if(!KEY){m.innerHTML='<div id="cfg"><div class="big">Stella</div>Адрес сервера и ключ:<input id="b" value="'+BASE+'"><input id="k" type="password" placeholder="STELLA_API_KEY"><div class="it sel" id="ok">Подключить</div></div>';
    $("ok").onclick=()=>{BASE=$("b").value.replace(/\/$/,"");KEY=$("k").value;store.set("stella_key",KEY);store.set("stella_base",BASE);connect();render();startListening()};return}
  if(screen==="menu"){
    m.className="";m.innerHTML='<div class="dim" style="margin-bottom:8px">'+esc(lastHud).slice(0,90)+'</div><div class="menu">'+
      MENU.map((x,i)=>'<div class="it'+(i===idx?' sel':'')+'">'+x[0]+'</div>').join("")+"</div>";return}
  const title=(MENU.find(x=>x[1]===screen)||[screen])[0];
  let body="";
  if(["messages","calendar","home"].includes(screen))
    body=list.length?list.map((r,i)=>'<div class="row'+(i===idx?' sel':'')+'">'+esc(r)+"</div>").join(""):'<div class="dim">пусто</div>';
  else if(screen==="vision")body='<div class="big">Зрение</div>Наведите на текст/вопрос/предмет.<br>⏎ — снимок, ответ появится сам.';
  else if(screen==="faces")body='<div class="big">Лица</div>⏎ — кто напротив? (только база /admin)';
  else if(screen==="memory")body='<div class="big">Память</div>⏎ — запомнить, что вижу.<br>Спросить «где ключи?» — клавиша V.';
  else if(screen==="meeting")body='<div class="big">Совещание</div>⏎ — старт/стоп.<br>Субтитры и подсказки на линзе.';
  m.className="fade";m.innerHTML='<div class="big" style="margin-bottom:8px">'+title+"</div>"+body;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function api(path,opt={}){const r=await fetch(BASE+path,{...opt,headers:{...H(),...(opt.headers||{})}});if(!r.ok)throw new Error(r.status);return r.json()}

const BOOT={vision:["ЗРЕНИЕ",["Включаю камеру…","Настраиваю модель зрения…","Готово"]],faces:["РАСПОЗНАВАНИЕ ЛИЦ",["Включаю камеру…","Загружаю базу…","Готово"]],memory:["ПАМЯТЬ",["Включаю камеру…","Открываю архив…","Готово"]]};
async function openScreen(s){
  if(BOOT[s]){bootAnim(BOOT[s][0],BOOT[s][1]);frame().catch(()=>{})}
  screen=s;idx=0;list=[];if(["messages","calendar","home"].includes(s))busyOn("Загружаю");render();
  try{
    if(s==="messages")list=(await api("/api/messages")).map(r=>(r.importance==="urgent"?"! ":"")+r.sender+": "+r.text);
    if(s==="calendar")list=(await api("/api/calendar")).map(e=>e.error||((e.start||"").slice(5,16).replace("T"," ")+" "+e.title));
    if(s==="home")list=(await api("/api/home")).map(d=>(d.name||d.entity)+" — "+d.state);
  }catch(e){list=["ошибка: "+e.message]}
  busyOff(true);render();
}

/* ---------- камера ---------- */
let camStream;
async function frame(){
  if(!camStream){camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280}},audio:false});$("cam").srcObject=camStream;await $("cam").play()}
  const v=$("cam"),c=document.createElement("canvas"),k=Math.min(1,800/(v.videoWidth||800));
  c.width=(v.videoWidth||800)*k;c.height=(v.videoHeight||600)*k;c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",0.8));
}
async function post(path,field,blob,name){const f=new FormData();f.append(field,blob,name);return api(path,{method:"POST",body:f})}
async function guarded(fn){if(busy)return;busy=true;try{await fn()}catch(e){toast("Ошибка: "+e.message)}finally{busy=false;busyOff(true)}}

const doVision=()=>guarded(async()=>{busyOn("Смотрю");const r=await post("/vision/look","image",await frame(),"f.jpg");if(!r.text)toast("Ничего важного.",2000)});
const doFace=()=>guarded(async()=>{busyOn("Снимаю");await post("/faces/identify","image",await frame(),"f.jpg")});
const doMemory=()=>guarded(async()=>{busyOn("Запоминаю");await post("/vision/remember","image",await frame(),"f.jpg")});

/* ---------- запись голоса ---------- */
let mic;
async function micStream(){return mic||(mic=await navigator.mediaDevices.getUserMedia({audio:true}))}
async function record(maxMs,stopOnSilence=true){
  const s=await micStream(),rec=new MediaRecorder(s),chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  const done=new Promise(r=>rec.onstop=r);
  const ctx=new AudioContext(),src=ctx.createMediaStreamSource(s),an=ctx.createAnalyser();src.connect(an);
  const buf=new Uint8Array(an.fftSize);rec.start();
  const t0=Date.now();let lastVoice=t0,heard=false;
  const iv=setInterval(()=>{an.getByteTimeDomainData(buf);let m=0;for(const b of buf)m=Math.max(m,Math.abs(b-128));
    waveLevel(m/90);if(m>12){lastVoice=Date.now();heard=true}
    if(Date.now()-t0>maxMs||(stopOnSilence&&heard&&Date.now()-lastVoice>1400)||(stopOnSilence&&!heard&&Date.now()-t0>6000))rec.stop()},120);
  await done;clearInterval(iv);ctx.close();
  return new Blob(chunks,{type:rec.mimeType||"audio/webm"});
}
const ext=b=>b.type.includes("ogg")?"ogg":b.type.includes("mp4")?"m4a":"webm";
const doVoice=()=>guarded(async()=>{busyOn("Слушаю",true);const b=await record(15000);busyOff(true);busyOn("Распознаю");const r=await post("/voice","audio",b,"v."+ext(b));if(!r.heard)toast("Не расслышала.",2500)});

/* ---------- голосовой ответ (событие record) ---------- */
let recBusy=false;
async function voiceReply(sender,sec){recBusy=true;await guarded(async()=>{busyOn("Диктуйте ответ для "+sender,true);const b=await record(sec*1000);busyOff(true);busyOn("Отправляю на проверку");await post("/voice/reply?sender="+encodeURIComponent(sender),"audio",b,"v."+ext(b))});recBusy=false}

/* ---------- совещание ---------- */
let meetOn=false;
function startMeetLoop(){
  if(meetOn)return;meetOn=true;
  bootAnim("РЕЖИМ: СОВЕЩАНИЕ",["Включаю микрофон…","Подключаю распознавание…","Готова слушать"]);
  $("sub").style.display="block";
  (async()=>{while(meetOn){try{const b=await record(4000,false);if(!meetOn)break;await post("/meeting/chunk","audio",b,"c."+ext(b))}catch(e){await new Promise(r=>setTimeout(r,1500))}}})();
}
function stopMeetLoop(){meetOn=false;$("sub").style.display="none"}
async function toggleMeeting(){   // кнопка; обычно всё голосом: «Стелла, включи совещание»
  if(meetOn){busyOn("Готовлю резюме");try{const r=await api("/meeting/stop",{method:"POST"});toast(r.summary||"Совещание завершено.",15000)}finally{busyOff(true)}return}
  await api("/meeting/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"meeting",context:""})});
}

/* ---------- 3D ---------- */
function openLab(spec){
  closeLab();bootAnim("3D-ЛАБОРАТОРИЯ",["Загружаю движок…","Строю сетку…","Готово"]);const f=document.createElement("iframe");f.id="lab";f.src="/lab3d";document.body.appendChild(f);
  f.onload=()=>{if(spec)f.contentWindow.postMessage({model:spec},"*")};
}
const closeLab=()=>{const f=$("lab");if(f)f.remove()};

/* ---------- SSE ---------- */
let es;
function connect(){
  if(!KEY)return;if(es)es.close();
  es=new EventSource(BASE+"/events?key="+encodeURIComponent(KEY));
  es.onopen=()=>{$("st").textContent="● online";$("st").className="";fetch(BASE+"/health").then(r=>r.json()).then(h=>{ttsOn=!!h.tts}).catch(()=>{})};
  es.onerror=()=>{$("st").textContent="● offline";$("st").className="off"};
  es.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onEvent(m)};
}
function onEvent(m){
  switch(m.type){
    case"capture":if(m.what==="look")doVision();else if(m.what==="face")doFace();else if(m.what==="memory")doMemory();break;
    case"open":if(m.screen==="menu"){closeLab();screen="menu";idx=0;render()}else if(m.screen==="lab")openLab();else if(MENU.some(x=>x[1]===m.screen)){closeLab();openScreen(m.screen)}break;
    case"meeting":if(m.state==="on")startMeetLoop();else stopMeetLoop();break;
    case"busy":if(m.on)busyOn(m.label||"Думаю");else busyOff(true);break;
    case"hud":toast(m.text);if(screen==="menu")render();break;
    case"speak":speak(m.text);break;
    case"scan":overlay('<div class="big scan">Сканирую лицо…</div><div class="bar"><i></i></div>');break;
    case"photo":overlay('<img src="'+m.image+'"><div class="dim" style="margin-top:8px">снимок</div>',(m.seconds||3)*1000);break;
    case"card":setTimeout(()=>{overlay('<div class="big">'+esc(m.name)+"</div><div style='margin-top:10px'>"+esc(m.note||"")+"</div>",9000);speak(m.name+". "+(m.note||""))},3200);break;
    case"suggest":suggestion(m);break;
    case"record":if(m.purpose==="voice_reply")voiceReply(m.sender,m.seconds||30);break;
    case"subtitle":$("subt").textContent=m.text;break;
    case"hint":{const h=$("hint");h.textContent="▶ "+m.text;h.style.display="block";setTimeout(()=>h.style.display="none",9000);break}
    case"model3d":openLab(m.spec);break;
  }
}
let pendingSuggest=null;
function suggestion(m){pendingSuggest=m;toast(m.text+"  [⏎ да / ▲ нет]",20000);speak(m.text)}

/* ---------- ввод: клавиши и свайпы тачпада ---------- */
function act(a){
  if(!KEY)return;
  if($("overlay").style.display==="flex"&&a==="back"){hideOverlay();return}
  if(pendingSuggest){const s=pendingSuggest;pendingSuggest=null;if(a==="ok"){api("/home/act",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({device:s.entity,action:s.action})}).then(r=>toast(r.status==="confirmation_required"?"Нужно подтверждение: скажите «да»":"Сделано"));return}if(a==="back"){toast("Ок, не буду.",2000);return}}
  if($("lab")){if(a==="back")closeLab();return}
  const n=(screen==="menu"?MENU.length:list.length)||1;
  if(a==="next")idx=(idx+1)%n;else if(a==="prev")idx=(idx-1+n)%n;
  else if(a==="back"){screen="menu";idx=0}
  else if(a==="voice")doVoice();
  else if(a==="cam")doVision();
  else if(a==="ok"){
    if(screen==="menu"){const s=MENU[idx][1];if(s==="lab")openLab();else openScreen(s);return}
    if(screen==="vision")doVision();else if(screen==="faces")doFace();else if(screen==="memory")doMemory();else if(screen==="meeting")toggleMeeting();
  }
  render();
}
addEventListener("keydown",e=>{const k={ArrowRight:"next",ArrowDown:"next",ArrowLeft:"prev",Enter:"ok",ArrowUp:"back",Escape:"back",Backspace:"back",v:"voice",V:"voice",c:"cam",C:"cam"}[e.key];if(k&&!(e.target.tagName==="INPUT")){e.preventDefault();act(k)}});
let tx=0,ty=0,tt=0;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now()});
addEventListener("touchend",e=>{if(e.target.tagName==="INPUT")return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))act(dx>0?"prev":"next");
  else if(dy<-40)act("back");else if(Date.now()-tt>600)act("voice");else if(Math.abs(dx)<10)act("ok")});
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})},1000);

/* ---------- всегда слушаю: «Стелла, ...» без кнопок ---------- */
let listenOn=false;
const listenPaused=()=>speaking||meetOn||recBusy||busyN>0;
function setMic(st){const e=$("mic");if(!e)return;e.textContent=st==="awake"?"🎙 слушаю вас":st==="pause"?"🎙 …":st==="off"?"🎙 нажмите":"🎙 «Стелла»";e.style.color=st==="awake"?"#fff":""}
async function startListening(){
  if(listenOn||!KEY)return;
  let s;try{s=await micStream()}catch(e){setMic("off");return}
  listenOn=true;
  const ctx=new (window.AudioContext||window.webkitAudioContext)();try{await ctx.resume()}catch(e){}
  const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(s).connect(an);
  const buf=new Uint8Array(an.fftSize);let noise=6,rec=null,spoke=false,t0=0,lastV=0;
  const level=()=>{an.getByteTimeDomainData(buf);let m=0;for(const b of buf)m=Math.max(m,Math.abs(b-128));return m};
  function start(){const arr=[];rec=new MediaRecorder(s);rec.arr=arr;rec.ondataavailable=e=>arr.push(e.data);rec.start();t0=Date.now();spoke=false;lastV=0}
  function finish(send){const r=rec;rec=null;r.onstop=()=>{if(send)sendUtterance(new Blob(r.arr,{type:r.mimeType||"audio/webm"}))};try{r.stop()}catch(e){}}
  setInterval(()=>{
    const now=Date.now();
    if(listenPaused()){if(rec)finish(false);setMic("pause");return}
    if(!rec)start();
    const l=level();
    if(l>Math.max(14,noise*2.5)){spoke=true;lastV=now}else if(!spoke)noise=noise*0.97+Math.min(l,25)*0.03;
    setMic(now<awakeUntil?"awake":"idle");
    if(spoke&&(now-lastV>1000||now-t0>15000))finish(true);         // фраза закончилась
    else if(!spoke&&now-t0>4000)finish(false);                      // тишина: перезапуск записи
  },100);
}
async function sendUtterance(blob){
  if(blob.size<3000)return;
  try{const f=new FormData();f.append("audio",blob,"u."+ext(blob));
    const r=await api("/voice/listen?awake="+(Date.now()<awakeUntil?1:0),{method:"POST",body:f});
    if(r.dbg)$("dbg").textContent="слышу: "+r.dbg;
    if(r.ack){awakeUntil=Date.now()+8000;beep();toast("Слушаю вас…",3000)}
    else if(r.handled&&!speaking)awakeUntil=Date.now()+8000;
  }catch(e){}
}
addEventListener("pointerdown",()=>startListening(),{once:true});addEventListener("keydown",()=>startListening(),{once:true});
connect();render();startListening();
</script></body></html>
