<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Стелла</title>
<style>
  :root {
    --bg0: #060814;
    --bg1: #0d1030;
    --ink: #eef1ff;
    --muted: #8c93bd;
    --a: #7c5cff;      /* фиолетовый */
    --b: #22d3ee;      /* бирюзовый */
    --c: #ff5fa2;      /* розовый */
    --lvl: 0;
    --glow: 0.35;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(1100px 700px at 15% -10%, #2a1f6b55, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #0e4d6b55, transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg0));
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    overflow: hidden;
    user-select: none;
  }

  header { width: 100%; max-width: 520px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 700; letter-spacing: .04em; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--b); box-shadow: 0 0 12px var(--b); display: inline-block; }
  .chip {
    font-size: 12px; padding: 6px 12px; border-radius: 999px; color: var(--muted);
    background: #ffffff0d; border: 1px solid #ffffff14; display: flex; align-items: center; gap: 8px;
  }
  .chip b { width: 7px; height: 7px; border-radius: 50%; background: #5b6190; display: inline-block; }
  body[data-conn="on"] .chip b { background: #34d399; box-shadow: 0 0 8px #34d399; }
  body[data-conn="off"] .chip b { background: #f87171; box-shadow: 0 0 8px #f87171; }

  main { flex: 1; width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; min-height: 0; }

  /* ---------- шар ---------- */
  .stage { position: relative; width: min(74vw, 320px); aspect-ratio: 1; display: grid; place-items: center; }
  .ring, .orb, .halo { position: absolute; border-radius: 50%; }
  .halo {
    inset: -22%;
    background: conic-gradient(from 0deg, var(--a), var(--b), var(--c), var(--a));
    filter: blur(46px); opacity: var(--glow);
    transition: opacity .6s ease;
    animation: spin 14s linear infinite;
  }
  .ring { inset: 0; border: 1.5px solid #ffffff22; opacity: 0; }
  .orb {
    inset: 12%;
    background:
      radial-gradient(circle at 32% 28%, #ffffffcc 0 6%, transparent 22%),
      radial-gradient(circle at 70% 78%, #22d3ee99, transparent 55%),
      radial-gradient(circle at 30% 70%, #ff5fa299, transparent 55%),
      radial-gradient(circle at 50% 50%, #7c5cff, #3b2a9e 75%, #1b1465);
    box-shadow: inset 0 -14px 40px #0006, inset 0 10px 30px #ffffff22, 0 20px 60px #4c33d655;
    transform: scale(calc(1 + var(--lvl) * .16));
    transition: transform .09s ease-out;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @keyframes wave { 0% { transform: scale(.78); opacity: .55; } 100% { transform: scale(1.32); opacity: 0; } }
  @keyframes talk { 0%,100% { transform: scale(1); } 20% { transform: scale(1.09); } 45% { transform: scale(.96); } 70% { transform: scale(1.12); } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .8; } }

  body[data-state="idle"] .orb { animation: breathe 4.8s ease-in-out infinite; }
  body[data-state="idle"] { --glow: .32; }
  body[data-state="loading"] .orb, body[data-state="connecting"] .orb { animation: breathe 1.3s ease-in-out infinite; filter: saturate(.8); }
  body[data-state="loading"], body[data-state="connecting"] { --glow: .45; }
  body[data-state="loading"] .halo, body[data-state="connecting"] .halo { animation-duration: 3s; }
  body[data-state="listening"] { --glow: .6; }
  body[data-state="listening"] .ring { animation: wave 2.2s ease-out infinite; }
  body[data-state="listening"] .ring:nth-of-type(2) { animation-delay: 1.1s; }
  body[data-state="speaking"] { --glow: .85; }
  body[data-state="speaking"] .orb { animation: talk 1.15s ease-in-out infinite; }
  body[data-state="speaking"] .ring { animation: wave 1.1s ease-out infinite; border-color: #22d3ee66; }
  body[data-state="speaking"] .ring:nth-of-type(2) { animation-delay: .55s; }
  body[data-state="off"] .orb, body[data-conn="off"] .orb { filter: grayscale(.85) brightness(.7); }
  body[data-state="off"], body[data-conn="off"] { --glow: .12; }

  /* ---------- подписи ---------- */
  .status { text-align: center; min-height: 74px; }
  .status h1 { margin: 0; font-size: clamp(24px, 6.4vw, 32px); font-weight: 700; letter-spacing: -.01em; }
  .status p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }

  .log { width: 100%; display: flex; flex-direction: column; gap: 8px; max-height: 26vh; overflow: hidden; justify-content: flex-end;
         -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%); mask-image: linear-gradient(to bottom, transparent, #000 35%); }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.35; animation: pop .25s ease-out; user-select: text; }
  .msg.user { align-self: flex-end; background: #ffffff12; border: 1px solid #ffffff14; border-bottom-right-radius: 6px; }
  .msg.agent { align-self: flex-start; background: linear-gradient(135deg, #7c5cff55, #22d3ee33); border: 1px solid #ffffff1c; border-bottom-left-radius: 6px; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  footer { width: 100%; max-width: 520px; display: flex; gap: 10px; justify-content: center; padding-top: 14px; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  .btn {
    flex: 1; padding: 14px 16px; border-radius: 16px; font-size: 15px; font-weight: 600;
    background: #ffffff0f; border: 1px solid #ffffff1a; backdrop-filter: blur(10px);
  }
  .btn:active { transform: scale(.98); background: #ffffff1a; }
  .btn.hidden { display: none; }

  /* ---------- стартовый экран ---------- */
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 28px;
    background: radial-gradient(900px 700px at 50% 30%, #2a1f6bcc, #060814f2 70%);
    backdrop-filter: blur(8px); text-align: center;
  }
  #start h2 { margin: 0; font-size: 30px; }
  #start p { margin: 0; color: var(--muted); max-width: 320px; line-height: 1.5; }
  #go {
    padding: 18px 34px; border-radius: 999px; border: 0; font-size: 18px; font-weight: 700; color: #07091a;
    background: linear-gradient(135deg, var(--b), #a78bfa 60%, var(--c)); box-shadow: 0 12px 40px #7c5cff77;
  }
  #go:active { transform: scale(.97); }
  #err { color: #fca5a5; min-height: 20px; font-size: 14px; max-width: 320px; }

  #dim { position: fixed; inset: 0; z-index: 20; background: #000; display: none; align-items: flex-end; justify-content: center; padding-bottom: 40px; color: #3b3f66; font-size: 13px; }
  #dim.on { display: flex; }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001s !important; } }
  @media (max-height: 640px) { .log { display: none; } .stage { width: min(56vw, 220px); } }
</style>
</head>
<body data-state="off" data-conn="off">

<header>
  <div class="brand"><i></i><span id="name">Стелла</span></div>
  <div class="chip"><b></b><span id="chip">не подключена</span></div>
</header>

<main>
  <div class="stage">
    <div class="halo"></div>
    <div class="ring"></div><div class="ring"></div>
    <div class="orb"></div>
  </div>
  <div class="status">
    <h1 id="title">Готова к работе</h1>
    <p id="hint">Нажмите «Включить», чтобы телефон стал микрофоном</p>
  </div>
  <div class="log" id="log"></div>
</main>

<footer>
  <button class="btn hidden" id="dimBtn">Затемнить экран</button>
  <button class="btn hidden" id="stopBtn">Выключить</button>
</footer>

<div id="start">
  <h2>Умная колонка</h2>
  <p>Телефон будет круглосуточно слушать слово «Стелла» и передавать звук на колонку. Разрешите доступ к микрофону.</p>
  <button id="go">Включить</button>
  <div id="err"></div>
</div>
<div id="dim">Нажмите на экран, чтобы вернуть яркость</div>

<script>
const $ = s => document.querySelector(s);
const LABELS = {
  loading:    ["Загружаю слух…", "Это займёт около минуты"],
  idle:       ["Скажите «{w}»", "Я слушаю"],
  connecting: ["Подключаюсь…", ""],
  listening:  ["Слушаю вас", "Говорите"],
  speaking:   ["Говорю", ""],
};
let ws, ctx, node, stream, wakeLock, retry = 0, micOn = false, state = "off", wakeWord = "стелла", lvl = 0, notice = 0;

function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

function render() {
  document.body.dataset.state = state;
  let t, h;
  if (!micOn) { t = "Готова к работе"; h = "Нажмите «Включить», чтобы телефон стал микрофоном"; }
  else if (document.body.dataset.conn === "off") { t = "Нет связи с колонкой"; h = "Пробую подключиться снова…"; }
  else { [t, h] = (LABELS[state] || ["…", ""]); t = t.replace("{w}", cap(wakeWord)); }
  $("#title").textContent = t;
  $("#hint").textContent = h;
  $("#chip").textContent = !micOn ? "не подключена" : document.body.dataset.conn === "on" ? "на связи" : "нет связи";
  $("#name").textContent = cap(wakeWord);
  document.title = cap(wakeWord);
}

function setConn(on) { document.body.dataset.conn = on ? "on" : "off"; render(); }

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text;
  const log = $("#log"); log.appendChild(d);
  while (log.children.length > 6) log.removeChild(log.firstChild);
}

function connect() {
  clearTimeout(connect.t);
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { retry = 0; setConn(true); };
  ws.onclose = () => { setConn(false); if (micOn) connect.t = setTimeout(connect, Math.min(1000 * 2 ** retry++, 8000)); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    if (typeof e.data !== "string") return;
    const m = JSON.parse(e.data);
    if (m.type === "state") { state = m.state; if (m.wake_word) wakeWord = m.wake_word; render(); }
    else if (m.type === "msg") addMsg(m.role, m.text);
    else if (m.type === "notice") { addMsg("agent", m.text); }
  };
}

// Захват микрофона. Обработчик пересчитывает частоту дискретизации в 16 кГц и шлёт 16-битный PCM по 100 мс.
const WORKLET = `
class DS extends AudioWorkletProcessor {
  constructor() { super(); this.r = sampleRate / 16000; this.pos = 0; this.acc = 0; this.cnt = 0;
    this.out = new Int16Array(1600); this.n = 0; this.e = 0; this.ec = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = ch[i]; this.acc += s; this.cnt++; this.e += s * s; this.ec++; this.pos++;
      if (this.pos >= this.r) {
        this.pos -= this.r;
        const v = Math.max(-1, Math.min(1, this.acc / this.cnt));
        this.out[this.n++] = v < 0 ? v * 32768 : v * 32767; this.acc = 0; this.cnt = 0;
        if (this.n === 1600) { const b = this.out.slice().buffer; this.port.postMessage({ pcm: b }, [b]); this.n = 0; }
      }
    }
    if (this.ec >= 1600) { this.port.postMessage({ level: Math.sqrt(this.e / this.ec) }); this.e = 0; this.ec = 0; }
    return true;
  }
}
registerProcessor("ds", DS);`;

async function startMic() {
  if (!window.isSecureContext || !navigator.mediaDevices) throw new Error("Откройте страницу по адресу https://… (с защищённым соединением).");
  stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const url = URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" }));
  await ctx.audioWorklet.addModule(url);
  node = new AudioWorkletNode(ctx, "ds");
  node.port.onmessage = e => {
    if (e.data.pcm) { if (ws && ws.readyState === 1 && ws.bufferedAmount < 300000) ws.send(e.data.pcm); }
    else if (e.data.level !== undefined) {
      lvl = lvl * .6 + Math.min(1, e.data.level * 9) * .4;
      document.documentElement.style.setProperty("--lvl", state === "listening" ? lvl.toFixed(3) : "0");
    }
  };
  const mute = ctx.createGain(); mute.gain.value = 0;
  ctx.createMediaStreamSource(stream).connect(node); node.connect(mute); mute.connect(ctx.destination);
  stream.getAudioTracks()[0].addEventListener("ended", () => { if (micOn) location.reload(); });
}

async function keepAwake() {
  try { if ("wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && micOn) { keepAwake(); if (ctx && ctx.state === "suspended") ctx.resume(); }
});

$("#go").onclick = async () => {
  $("#err").textContent = "";
  try {
    await startMic();
  } catch (e) {
    $("#err").textContent = e.name === "NotAllowedError" ? "Нет доступа к микрофону. Разрешите его в настройках браузера для этого сайта." : (e.message || String(e));
    return;
  }
  micOn = true; $("#start").style.display = "none";
  $("#dimBtn").classList.remove("hidden"); $("#stopBtn").classList.remove("hidden");
  keepAwake(); connect(); render();
};
$("#stopBtn").onclick = () => location.reload();
$("#dimBtn").onclick = () => $("#dim").classList.add("on");
$("#dim").onclick = () => $("#dim").classList.remove("on");
render();
</script>
</body>
</html>
