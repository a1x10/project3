<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS — Stella Rescue</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --text:#eef0f4; --muted:#9aa3b2; --me:#2f6fed;
          --bot:#262a33; --advice:#5a4a12; --rescuer:#14532d; --red:#e5484d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; max-width:640px; margin:0 auto; }
  header { padding:12px 16px; background:var(--red); font-weight:700; }
  header small { display:block; font-weight:400; opacity:.9; }
  #broadcast { display:none; padding:10px 16px; background:#1e3a8a; }
  #log { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--me); }
  .assistant { align-self:flex-start; background:var(--bot); }
  .advice { align-self:stretch; max-width:100%; background:var(--advice); }
  .rescuer { align-self:flex-start; background:var(--rescuer); }
  .who { display:block; font-size:12px; color:var(--muted); margin-bottom:2px; }
  .advice .who, .rescuer .who { color:#fde68a; }
  #typing { display:none; color:var(--muted); padding:0 16px 6px; font-size:14px; }
  #quick { display:flex; gap:6px; overflow-x:auto; padding:6px 16px; }
  #quick button { flex:none; background:var(--panel); color:var(--text); border:1px solid #333a46;
                  border-radius:16px; padding:6px 12px; font-size:14px; }
  form { display:flex; gap:8px; padding:8px 16px 12px; background:var(--panel); }
  textarea { flex:1; resize:none; min-height:44px; max-height:120px; padding:10px; border-radius:10px;
             border:1px solid #333a46; background:var(--bg); color:var(--text); font:inherit; }
  form button { background:var(--red); color:#fff; border:0; border-radius:10px; padding:0 16px;
                font-weight:700; font-size:16px; }
  #geo { background:none; border:0; color:#93c5fd; text-decoration:underline; padding:0 16px 8px;
         text-align:left; font-size:14px; }
</style>
</head>
<body>
<header>SOS — связь со спасателями
  <small>Интернета нет. Это локальная сеть спасателей. Опишите, что случилось.</small>
</header>
<div id="broadcast"></div>
<div id="log" aria-live="polite"></div>
<div id="typing">Диспетчер печатает…</div>
<div id="quick">
  <button type="button">Меня завалило</button>
  <button type="button">Есть раненые</button>
  <button type="button">Сильное кровотечение</button>
  <button type="button">Человек без сознания</button>
  <button type="button">Не могу выйти</button>
  <button type="button">Я цел, в безопасности</button>
</div>
<button id="geo" type="button">📍 Отправить мою геопозицию</button>
<form id="form">
  <textarea id="text" maxlength="1000" placeholder="Где вы? Что случилось? Сколько людей?"></textarea>
  <button type="submit">➤</button>
</form>
<script>
(function () {
  var log = document.getElementById('log');
  var sid = null, lastId = 0, lastBroadcast = 0;
  var WHO = { assistant: 'Диспетчер', advice: 'Первая помощь', rescuer: 'Спасатель', user: 'Вы' };

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function api(method, url, body) {
    return fetch(url, { method: method, headers: { 'Content-Type': 'application/json' },
                        body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
  }

  function add(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var who = document.createElement('span');
    who.className = 'who'; who.textContent = WHO[role] || role;
    div.appendChild(who);
    div.appendChild(document.createTextNode(text));   // textContent — без XSS
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function poll() {
    if (!sid) return;
    api('GET', '/api/messages?session_id=' + sid + '&after=' + lastId + '&after_broadcast=' + lastBroadcast)
      .then(function (d) {
        d.messages.forEach(function (m) { lastId = m.id; add(m.role, m.text); });
        d.broadcasts.forEach(function (b) {
          lastBroadcast = b.id;
          var el = document.getElementById('broadcast');
          el.textContent = '📢 ' + b.text; el.style.display = 'block';
        });
        document.getElementById('typing').style.display = d.typing ? 'block' : 'none';
      }).catch(function () {});
  }

  function send(text, extra) {
    text = (text || '').trim();
    if (!text || !sid) return;
    var body = { session_id: sid, text: text };
    for (var k in (extra || {})) body[k] = extra[k];
    document.getElementById('typing').style.display = 'block';
    return api('POST', '/api/chat', body).then(poll).catch(function (e) { add('assistant', 'Не отправлено: ' + e.message); });
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = document.getElementById('text');
    send(t.value); t.value = '';
  });
  document.getElementById('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('#quick button'), function (b) {
    b.addEventListener('click', function () { send(b.textContent); });
  });

  // Браузеры дают геолокацию только по HTTPS, поэтому на портале она часто недоступна —
  // тогда просим прислать координаты из приложения карт или описать ориентиры.
  document.getElementById('geo').addEventListener('click', function () {
    var fail = function () {
      add('assistant', 'Телефон не дал геопозицию этой странице. Откройте приложение карт, ' +
          'нажмите на свою точку, скопируйте координаты (например 43.2389, 76.8897) и пришлите сюда. ' +
          'Или опишите адрес, этаж и ориентиры.');
    };
    if (!navigator.geolocation) return fail();
    navigator.geolocation.getCurrentPosition(function (p) {
      send('Моя геопозиция: ' + p.coords.latitude.toFixed(5) + ', ' + p.coords.longitude.toFixed(5),
           { lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy });
    }, fail, { enableHighAccuracy: true, timeout: 15000 });
  });

  sid = store('stella_sid');
  var ready = sid ? Promise.resolve() : api('POST', '/api/session').then(function (d) { sid = d.session_id; store('stella_sid', sid); });
  ready.then(function () {
    if (!lastId) add('assistant', 'Здравствуйте. Я диспетчер спасательной службы, работаю без интернета. ' +
                                  'Где вы находитесь и есть ли раненые?');
    poll(); setInterval(poll, 2500);
  });
})();
</script>
</body>
</html>
