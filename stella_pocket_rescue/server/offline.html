<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="30">
<title>Stella Pocket: коробка не в сети</title>
<style>
  :root{ color-scheme:dark; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:#0b0b0d; color:#f5f5f7;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; padding:24px; box-sizing:border-box; }
  .card{ max-width:440px; padding:32px 28px; border-radius:22px; background:#1c1c1e; border:1px solid rgba(255,255,255,.08); text-align:center; }
  .dot{ width:14px; height:14px; margin:0 auto 18px; border-radius:50%; background:#ff9f0a; box-shadow:0 0 0 6px rgba(255,159,10,.18); }
  h1{ margin:0 0 10px; font-size:22px; letter-spacing:-.01em; }
  p{ margin:0 0 10px; color:#a1a1a6; }
  small{ color:#6e6e73; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Коробка сейчас не в сети</h1>
    <p>Stella Pocket подключается к этому адресу сама, когда у нее есть интернет: через кабель или телефон по USB.</p>
    <p>Рядом с коробкой подключитесь к Wi-Fi <b>SOS-STELLA-RESCUE</b>: там все работает и без интернета.</p>
    <small>Страница обновится сама через 30 секунд.</small>
  </div>
</body>
</html>
