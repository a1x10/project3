# DHCP + "лживый" DNS: любой домен резолвится в адрес хаба -> срабатывает captive portal.
interface=wlan0
bind-interfaces
listen-address=10.42.0.1
no-resolv
no-hosts
dhcp-range=10.42.0.10,10.42.0.250,255.255.255.0,2h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
# RFC 8910: прямо сообщаем телефону адрес портала (Android 11+, iOS 14+)
dhcp-option=114,"http://10.42.0.1/"
address=/#/10.42.0.1
address=/stella.rescue/10.42.0.1
dhcp-leasefile=/var/lib/misc/stella.leases
