# Открытая точка доступа на встроенном Wi-Fi Orange Pi 4 LTS (AP6256, драйвер brcmfmac).
# 2.4 ГГц выбран специально: лучше проходит сквозь стены и завалы, чем 5 ГГц,
# и его видят даже старые телефоны.
interface=wlan0
driver=nl80211
ssid=SOS-STELLA-RESCUE
country_code=RU
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
# Сеть открытая (без пароля) — чтобы подключиться мог любой.
max_num_sta=32
