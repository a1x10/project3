limit_req_zone $binary_remote_addr zone=stella_api:1m rate=3r/s;
limit_req_zone $binary_remote_addr zone=stella_login:1m rate=6r/m;

# Запросы из интернета приходят через туннель на 127.0.0.1:8088, адрес человека передает
# сервер в заголовке X-Real-IP. Без этой подмены все люди из интернета делили бы один лимит.
map $http_x_real_ip $stella_remote_ip {
    "~^[0-9A-Fa-f.:]{3,45}$" $http_x_real_ip;
    default "tunnel";
}
map $http_x_forwarded_proto $stella_remote_proto {
    https https;
    default http;
}
limit_req_zone $stella_remote_ip zone=stella_remote_api:2m rate=3r/s;
limit_req_zone $stella_remote_ip zone=stella_remote_login:1m rate=6r/m;

# Сеть SOS, кабель и USB. X-Stella-Via сообщает сайту, откуда пришел запрос:
# portal (порт 80), tunnel (интернет через сервер), portal-tls (HTTPS без интернета).
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 16k;
    access_log off;
    limit_req_status 429;

    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Stella-Via portal;
    proxy_set_header X-Forwarded-Proto http;

    location = /static/ping.gif {
        alias /opt/stella/app/static/ping.gif;
        expires -1;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /static/ {
        alias /opt/stella/app/static/;
        expires 1h;
    }

    location = /api/admin/login {
        limit_req zone=stella_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/verify/ai-test {
        limit_req zone=stella_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=stella_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# Вход из интернета: сюда ведет обратный SSH-туннель с сервера (stella-tunnel.service).
# Слушает только 127.0.0.1, из сети SOS и с кабеля сюда не попасть.
server {
    listen 127.0.0.1:8088;
    server_name _;

    client_max_body_size 16k;
    access_log off;
    limit_req_status 429;

    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $stella_remote_ip;
    proxy_set_header X-Stella-Via tunnel;
    proxy_set_header X-Forwarded-Proto $stella_remote_proto;

    location /static/ {
        alias /opt/stella/app/static/;
        expires 1h;
    }

    location = /api/admin/login {
        limit_req zone=stella_remote_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/verify/ai-test {
        limit_req zone=stella_remote_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=stella_remote_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# HTTPS без интернета для двух доменов: файл пишет команда stella tls sync, когда есть сертификаты.
include /etc/stella/nginx/*.conf;
