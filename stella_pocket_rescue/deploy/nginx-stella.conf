limit_req_zone $binary_remote_addr zone=stella_api:1m rate=3r/s;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 16k;
    access_log off;

    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /static/ping.gif {
        alias /opt/stella/app/static/ping.gif;
        expires -1;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /static/ {
        alias /opt/stella/app/static/;
        expires 1h;
    }

    location = /api/verify/ai-test {
        limit_req zone=stella_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=stella_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
