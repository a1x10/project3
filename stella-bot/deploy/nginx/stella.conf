# Нужен, только если что-то должно быть доступно снаружи по HTTPS через СВОЙ домен
# (панель управления вместо туннеля Cloudflare, или Evolution API на другом сервере).
# В схеме «всё в одном docker compose» вебхук идёт по внутренней сети и nginx не обязателен.
#
# Установка:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/stella.conf /etc/nginx/sites-available/stella.conf
#   sudo sed -i 's/bot.example.com/ВАШ_ДОМЕН/' /etc/nginx/sites-available/stella.conf
#   sudo ln -s /etc/nginx/sites-available/stella.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ВАШ_ДОМЕН

server {
    listen 80;
    server_name bot.example.com;

    # Только вебхук и health. Панель Evolution (/manager) наружу НЕ открываем — только SSH-туннель:
    #   ssh -L 18080:127.0.0.1:18080 user@server  ->  http://localhost:18080/manager
    location = /webhook {
        proxy_pass http://127.0.0.1:18000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18000/health;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Панель управления: API и сам сайт (/panel/). Настоящий адрес клиента — для защиты от подбора паролей;
    # чужой CF-Connecting-IP обнуляем, чтобы его нельзя было подделать.
    location /admin/api/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        client_max_body_size 64k;
    }

    location /panel/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
    }

    location / {
        return 404;
    }
}
