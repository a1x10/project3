# Нужен, только если что-то должно быть доступно снаружи по HTTPS
# (например, Evolution API стоит на другом сервере и шлёт вебхуки сюда).
# В схеме «всё в одном docker compose» вебхук идёт по внутренней сети и nginx не обязателен.
#
# Установка:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/stella.conf /etc/nginx/sites-available/stella.conf
#   sudo sed -i 's/bot.example.com/ВАШ_ДОМЕН/' /etc/nginx/sites-available/stella.conf
#   sudo ln -s /etc/nginx/sites-available/stella.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ВАШ_ДОМЕН

server {
    listen 80;
    server_name bot.example.com;

    # Только вебхук и health. Панель Evolution (/manager) наружу НЕ открываем — только SSH-туннель:
    #   ssh -L 8080:127.0.0.1:8080 user@server  ->  http://localhost:8080/manager
    location = /webhook {
        proxy_pass http://127.0.0.1:8000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location / {
        return 404;
    }
}
