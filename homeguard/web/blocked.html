<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сайт заблокирован — HomeGuard</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#150a0d;color:#f3e9eb;font-family:system-ui,Segoe UI,Roboto,sans-serif;padding:16px}
  .card{display:flex;gap:32px;align-items:center;max-width:860px;width:100%;background:#1f1117;border:1px solid #4a1d28;border-radius:20px;padding:28px;box-shadow:0 0 60px #ff2a4d22}
  .video{flex:0 0 260px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:864/1080}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .shield{width:56px;height:56px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #ff2a4d)}50%{transform:scale(1.12);filter:drop-shadow(0 0 14px #ff2a4d)}}
  h1{margin:12px 0 6px;font-size:28px}
  .reason{color:#ff7a8f;font-weight:600;margin:0 0 16px}
  .domain{font-family:ui-monospace,Consolas,monospace;background:#2a1820;padding:8px 12px;border-radius:8px;word-break:break-all;display:inline-block}
  p{line-height:1.5;color:#cdb9be}
  @media(max-width:640px){.card{flex-direction:column}.video{flex-basis:auto;width:70%}}
</style>
</head>
<body>
<div class="card">
  <div class="video"><video src="/static/blocked.mp4" autoplay loop muted playsinline></video></div>
  <div>
    <svg class="shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z" fill="#ff2a4d"/><path d="M12 7v6M12 16.5v.5" stroke="#150a0d" stroke-width="2.2" stroke-linecap="round"/></svg>
    <h1>Стоп! Сайт заблокирован</h1>
    <p class="reason">{{reason}}</p>
    <span class="domain">{{domain}}</span>
    <p>HomeGuard остановил переход, потому что этот адрес считается небезопасным. Лучше закрыть страницу и ничего не вводить и не скачивать.</p>
  </div>
</div>
</body>
</html>
