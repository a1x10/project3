name: STELLS — сборка установщиков

on:
  workflow_dispatch:
  push:
    tags: ['stells-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: stells
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Секрет SLT-ключей
        run: node -e "const s=process.env.S; if(s) require('fs').writeFileSync('key-secret.json', JSON.stringify(s))"
        env:
          S: ${{ secrets.STELLS_KEY_SECRET }}
      - name: Сборка
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: STELLS-${{ matrix.os }}
          path: |
            stells/dist/*.exe
            stells/dist/*.dmg
            stells/dist/*.AppImage
            stells/dist/*.deb
          if-no-files-found: ignore
