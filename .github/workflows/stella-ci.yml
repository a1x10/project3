name: CI

on:
  push:
    paths: ['stella-coder/**', 'vibing-studio/**', 'cloud/**', 'tools/**', 'install.*', '.github/workflows/stella-ci.yml']
  pull_request:
    paths: ['stella-coder/**', 'vibing-studio/**', 'cloud/**', 'tools/**', 'install.*', '.github/workflows/stella-ci.yml']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: stella-coder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: stella-coder/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test the CLI binary and router manager
        run: node dist/cli/main.js --version && node dist/cli/main.js --help && node dist/cli/main.js router status && node ../install.mjs --help-check
      - name: Installer wrapper parses and runs (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 --help-check
      - name: Installer wrapper runs (install.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: install.cmd --help-check
      - name: Installer wrapper runs (install.sh)
        if: runner.os != 'Windows'
        working-directory: .
        run: ./install.sh --help-check

  cloud:
    name: stella-cloud (server, bot, site, docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run typecheck && npm run build
        working-directory: cloud/server
      - run: npm ci && npm run build
        working-directory: cloud/web
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
        working-directory: cloud/server
      - run: npm test
        working-directory: cloud/server
      - run: docker build -t stella-cloud:ci cloud
      - run: docker compose --env-file .env.example config -q
        working-directory: cloud
      - run: bash -n deploy.sh
        working-directory: cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stella-cloud-screenshots
          path: cloud/web/test-results/

  stella-package:
    name: STELLA CODER package (.tgz for the server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stella-coder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm pack
      - name: Package installs and runs
        run: npm i -g --prefix "$RUNNER_TEMP/p" ./stella-coder-*.tgz && "$RUNNER_TEMP/p/bin/stella-coder" --version
      - uses: actions/upload-artifact@v4
        with:
          name: stella-coder-package
          path: stella-coder/stella-coder-*.tgz

  vibing-studio:
    name: vibing-studio (unit, e2e in Chromium and Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibing-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: cloud/server
      - name: Build the development agent (STELLA CODER) used by the «Разработка» mode
        run: npm ci && npm run build
        working-directory: stella-coder
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: E2E_ELECTRON=1 xvfb-run -a npm run e2e
      - name: Bundled agent works under Electron's Node (as in the installer)
        run: |
          node scripts/bundle-agent.mjs
          ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron agent/dist/cli/main.js --version
          STUDIO_AGENT_ENTRY=$PWD/agent/dist/cli/main.js E2E_ELECTRON=1 xvfb-run -a npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibing-studio-screenshots
          path: vibing-studio/test-results/

  studio-windows:
    name: Vibing AI Studio — Windows installer (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vibing-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: STELLA installer script parses in Windows PowerShell 5.1
        shell: cmd
        working-directory: cloud/server
        run: |
          call npm ci --no-audit --no-fund
          node --import tsx -e "import('./src/installers.ts').then(m=>process.stdout.write(m.installPs1('https://ai.example.com','stella-coder-0.1.0.tgz')))" > %TEMP%\stella-install.ps1
          powershell -NoProfile -Command "$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile($env:TEMP+'\stella-install.ps1',[ref]$null,[ref]$e); if ($e) { $e; exit 1 } else { 'ok' }"
      - name: Build NSIS installer
        run: npm run dist:win
        env:
          VITE_CLOUD_URL: ${{ vars.STELLA_CLOUD_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: VibingAIStudio-Setup
          path: vibing-studio/release/*.exe
