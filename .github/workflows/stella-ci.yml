name: CI

on:
  push:
    paths: ['stella-coder/**', 'vibing-studio/**', 'cloud/**', 'tools/**', 'install.*', '.github/workflows/stella-ci.yml']
  pull_request:
    paths: ['stella-coder/**', 'vibing-studio/**', 'cloud/**', 'tools/**', 'install.*', '.github/workflows/stella-ci.yml']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: stella-coder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: stella-coder/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test the CLI binary and router manager
        run: node dist/cli/main.js --version && node dist/cli/main.js --help && node dist/cli/main.js router status && node ../install.mjs --help-check
      - name: Installer wrapper parses and runs (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 --help-check
      - name: Installer wrapper runs (install.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: install.cmd --help-check
      - name: Installer wrapper runs (install.sh)
        if: runner.os != 'Windows'
        working-directory: .
        run: ./install.sh --help-check

  cloud:
    name: stella-cloud (server, bot, site, docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run typecheck && npm run build
        working-directory: cloud/server
      - run: npm ci && npm run build
        working-directory: cloud/web
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
        working-directory: cloud/server
      - run: npm test
        working-directory: cloud/server
      - run: docker build -t stella-cloud:ci cloud
      - run: docker compose --env-file .env.example config -q
        working-directory: cloud
      - run: bash -n deploy.sh
        working-directory: cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stella-cloud-screenshots
          path: cloud/web/test-results/

  vibing-studio:
    name: vibing-studio (unit, e2e in Chromium and Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibing-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: cloud/server
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: E2E_ELECTRON=1 xvfb-run -a npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibing-studio-screenshots
          path: vibing-studio/test-results/

  studio-windows:
    name: Vibing AI Studio — Windows installer (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vibing-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build NSIS installer
        run: npm run dist:win
        env:
          VITE_CLOUD_URL: ${{ vars.STELLA_CLOUD_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: VibingAIStudio-Setup
          path: vibing-studio/release/*.exe
