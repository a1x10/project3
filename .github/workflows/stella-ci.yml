name: CI

on:
  push:
    paths: ['stella-coder/**', 'vibing-studio/**', 'tools/**', 'install.*', '.github/workflows/stella-ci.yml']
  pull_request:
    paths: ['stella-coder/**', 'vibing-studio/**', 'tools/**', 'install.*', '.github/workflows/stella-ci.yml']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: stella-coder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: stella-coder/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test the CLI binary and router manager
        run: node dist/cli/main.js --version && node dist/cli/main.js --help && node dist/cli/main.js router status && node ../install.mjs --help-check

  vibing-studio:
    name: vibing-studio (build, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibing-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vibing-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibing-studio-screenshots
          path: vibing-studio/test-results/
